[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Translate natural language into structured function calls."
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
]

[tool.mypy]
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
